<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一言日記</title>
<style>
:root{
  --paper:#fbf9f2; --ink:#1f2a44; --line:#b9cde0; --margin:#d9534f; --blue:#2f5fa7;
  --muted:#6b7488; --folder:#e9c46a; --folder-d:#d4a73c; --ok:#2e7d5b; --surface:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#1a1e29; --ink:#e8ecf5; --line:#34415c; --margin:#ef7b77; --blue:#8fb4ee;
  --muted:#9aa4bb; --folder:#c9a24a; --folder-d:#a9852f; --ok:#6fcf9f; --surface:#232938;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.7 "Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;
  padding:env(safe-area-inset-top,0) 0 40px}
main{max-width:720px;margin:0 auto;padding:20px 16px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:.08em}
h2{font-size:1.1rem;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.92rem}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--ink);background:var(--surface);border-radius:8px;padding:6px 14px}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#10192b}}
button.link{border:0;background:none;color:var(--blue);text-decoration:underline;padding:4px}
button.danger{color:var(--margin);border-color:var(--margin)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

/* notebook rows */
.book{background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:8px 0 8px;
  background-image:linear-gradient(to right,transparent 56px,var(--margin) 56px,var(--margin) 58px,transparent 58px)}
.row{display:flex;align-items:center;min-height:52px;border-bottom:1.5px solid var(--line);padding:0 12px 0 0}
.row:last-child{border-bottom:0}
.date{flex:0 0 56px;text-align:center;font-size:.78rem;line-height:1.2;color:var(--muted)}
.date b{display:block;font-size:1.05rem;color:var(--ink)}
.date.sun b{color:var(--margin)} .date.sat b{color:var(--blue)}
.row input{flex:1;border:0;background:transparent;padding:10px 0 10px 14px;min-width:0}
.row input::placeholder{color:var(--muted);opacity:.55}
.row .txt{flex:1;padding:8px 0 8px 14px;word-break:break-all}
.row.today{background:rgba(233,196,106,.22)}
.bar{height:12px;border:2px solid var(--ink);border-radius:8px;background:var(--surface);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

/* cards / folder */
.card{background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:12px 14px;margin:10px 0;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card .t{font-weight:700}
.card .m{font-size:.85rem;color:var(--muted)}
.folder{position:relative;background:var(--folder);border:2px solid var(--ink);border-radius:4px 10px 10px 10px;padding:18px 14px 12px;margin-top:22px}
.folder::before{content:"";position:absolute;left:-2px;top:-14px;width:110px;height:14px;background:var(--folder);border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0}
.folder h2{margin:0 0 6px}
.folder .card{background:var(--paper)}
.empty{color:var(--muted);padding:6px 2px}
form.new{background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:14px;display:grid;gap:12px}
form.new label{display:grid;gap:4px;font-size:.9rem}
form.new input{border:2px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:24px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%}
.toast.on{opacity:1}
.stamp{display:inline-block;border:3px solid var(--margin);color:var(--margin);border-radius:50%;padding:6px 10px;font-weight:700;transform:rotate(-10deg);margin-left:8px;font-size:.9rem}
@media print{
  body{background:#fff;color:#000} .noprint{display:none!important}
  .book{border-color:#000;background:#fff}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY = "hitokoto-diary-v1";
const $app = document.getElementById("app");
let state = load();
let view = {name:"home"};

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.diaries)) return s;
  }catch(e){}
  return {diaries:[]};
}
let saveFailed = false;
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); saveFailed=false; }
  catch(e){ if(!saveFailed) toast("保存できませんでした。ブラウザの設定を確認してください"); saveFailed=true; }
}
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.h); toast.h = setTimeout(()=>t.classList.remove("on"), 2600);
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dayOf(diary,i){ const [y,m,d]=diary.start.split("-").map(Number); return new Date(y,m-1,d+i); }
function filled(diary){ return Object.values(diary.entries).filter(v=>v.trim()).length; }
const WD = ["日","月","火","水","木","金","土"];
const fmtRange = d => { const a=dayOf(d,0), b=dayOf(d,d.days-1);
  return `${a.getMonth()+1}/${a.getDate()} 〜 ${b.getMonth()+1}/${b.getDate()}（${d.days}日間）`; };

function go(v){ view=v; render(); window.scrollTo(0,0); }

function render(){
  if(view.name==="new") return renderNew();
  if(view.name==="diary") return renderDiary();
  renderHome();
}

function renderHome(){
  const active = state.diaries.filter(d=>!d.done);
  const done = state.diaries.filter(d=>d.done);
  $app.innerHTML = `
    <div class="top">
      <div><h1>一言日記</h1><p class="sub">期間を決めて、1日ひとことずつ。全部うまったらフォルダへ。</p></div>
      <button class="primary" id="newBtn">＋ 新しい日記</button>
    </div>
    <h2>書いている日記</h2>
    ${active.length ? active.map(card).join("") : `<p class="empty">まだありません。「新しい日記」から始めましょう。</p>`}
    <section class="folder" aria-label="完成した日記のフォルダ">
      <h2>📁 完成フォルダ（${done.length}）</h2>
      ${done.length ? done.map(card).join("") : `<p class="empty">日記がうまると、ここに入ります。</p>`}
    </section>
    <div class="actions noprint">
      <button id="exp">バックアップを保存</button>
      <button id="imp">バックアップを読み込む</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>`;
  $app.querySelector("#newBtn").onclick = ()=>go({name:"new"});
  $app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go({name:"diary",id:b.dataset.open}));
  $app.querySelector("#exp").onclick = exportData;
  const f = $app.querySelector("#file");
  $app.querySelector("#imp").onclick = ()=>f.click();
  f.onchange = importData;
}
function card(d){
  const n = filled(d);
  return `<div class="card"><div><div class="t">${esc(d.title)}</div>
    <div class="m">${fmtRange(d)}　${d.done?"完成":`${n} / ${d.days} うまった`}</div></div>
    <button data-open="${d.id}">${d.done?"ひらく":"つづきを書く"}</button></div>`;
}

function renderNew(){
  const today = ymd(new Date());
  $app.innerHTML = `
    <h1>新しい日記</h1><p class="sub">期間は3日〜31日で選べます。</p>
    <form class="new" id="f">
      <label>タイトル<input name="title" required maxlength="40" value="夏休みの一言日記"></label>
      <label>はじまる日<input name="start" type="date" required value="${today}"></label>
      <label>日数（3〜31日）<input name="days" type="number" min="3" max="31" required value="7"></label>
      <div class="actions"><button class="primary" type="submit">はじめる</button>
      <button type="button" id="back">もどる</button></div>
    </form>`;
  $app.querySelector("#back").onclick = ()=>go({name:"home"});
  $app.querySelector("#f").onsubmit = e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    const days = Math.min(31, Math.max(3, parseInt(f.get("days"),10)||7));
    const d = {id:"d"+Date.now().toString(36), title:f.get("title").trim()||"一言日記",
      start:f.get("start"), days, entries:{}, done:false};
    state.diaries.unshift(d); save(); go({name:"diary",id:d.id});
  };
}

function renderDiary(){
  const d = state.diaries.find(x=>x.id===view.id);
  if(!d) return go({name:"home"});
  const todayStr = ymd(new Date());
  let rows = "";
  for(let i=0;i<d.days;i++){
    const dt = dayOf(d,i), w = dt.getDay();
    const cls = (w===0?"sun":w===6?"sat":"");
    const val = d.entries[i]||"";
    rows += `<div class="row ${ymd(dt)===todayStr?"today":""}">
      <div class="date ${cls}"><b>${dt.getDate()}</b>${dt.getMonth()+1}月 ${WD[w]}</div>
      ${d.done ? `<div class="txt">${esc(val)}</div>`
        : `<input data-i="${i}" maxlength="80" value="${esc(val)}" placeholder="今日のひとこと" aria-label="${dt.getMonth()+1}月${dt.getDate()}日のひとこと">`}
    </div>`;
  }
  $app.innerHTML = `
    <div class="actions noprint" style="margin:0 0 8px"><button class="link" id="back">← 一覧にもどる</button></div>
    <h1>${esc(d.title)}${d.done?`<span class="stamp">完成</span>`:""}</h1>
    <p class="sub">${fmtRange(d)}</p>
    ${d.done?"":`<div class="bar" aria-hidden="true"><i id="prog"></i></div><p class="sub" id="cnt"></p>`}
    <div class="book">${rows}</div>
    <div class="actions noprint">
      ${d.done?`<button id="print">印刷する</button><button id="reopen">編集にもどす</button>`:""}
      <button class="danger" id="del">この日記を削除</button>
    </div>`;
  $app.querySelector("#back").onclick = ()=>go({name:"home"});
  $app.querySelector("#del").onclick = ()=>{
    if(confirm("「"+d.title+"」を削除します。元にもどせません。")){
      state.diaries = state.diaries.filter(x=>x!==d); save(); go({name:"home"});
    }
  };
  if(d.done){
    $app.querySelector("#print").onclick = ()=>window.print();
    $app.querySelector("#reopen").onclick = ()=>{ d.done=false; save(); renderDiary(); };
    return;
  }
  const upd = ()=>{
    const n = filled(d);
    $app.querySelector("#prog").style.width = (n/d.days*100)+"%";
    $app.querySelector("#cnt").textContent = `${n} / ${d.days} うまった`;
  };
  upd();
  $app.querySelectorAll("input[data-i]").forEach(inp=>{
    inp.addEventListener("input",()=>{
      d.entries[inp.dataset.i] = inp.value; save(); upd();
    });
    inp.addEventListener("change",()=>{
      if(filled(d)===d.days){
        d.done = true; d.doneAt = ymd(new Date()); save();
        toast("全部うまりました！フォルダに入れました 📁");
        renderDiary();
      }
    });
    inp.addEventListener("keydown",e=>{
      if(e.key==="Enter"){ e.preventDefault();
        const next = $app.querySelector(`input[data-i="${+inp.dataset.i+1}"]`);
        inp.blur(); if(next) next.focus(); }
    });
  });
  const first = [...$app.querySelectorAll("input[data-i]")].find(i=>!i.value.trim());
  if(first && !matchMedia("(pointer:coarse)").matches) first.focus();
}

function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hitokoto-diary-"+ymd(new Date())+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const s = JSON.parse(r.result);
      if(!s || !Array.isArray(s.diaries)) throw 0;
      const ids = new Set(state.diaries.map(d=>d.id));
      let added = 0;
      s.diaries.forEach(d=>{ if(d && d.id && d.start && d.days && !ids.has(d.id)){ state.diaries.push(d); added++; } });
      save(); toast(added+"件を読み込みました"); renderHome();
    }catch(_){ toast("読み込めませんでした。保存したJSONファイルを選んでください"); }
  };
  r.readAsText(file);
}
render();
</script>
</body>
</html>
